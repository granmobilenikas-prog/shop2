<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market SR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#111;color:#fff;padding:16px}
h1{font-size:20px;text-align:center;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border:0;border-radius:10px;background:#222;color:#fff;font-size:15px}
.tabs button.on{background:#2a7de1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1d1d1d;border:2px solid #1d1d1d;border-radius:12px;padding:14px;text-align:center}
.card.on{border-color:#2a7de1}
.card b{display:block;font-size:17px}
.card span{color:#aaa;font-size:14px}
input{width:100%;padding:12px;border-radius:10px;border:0;background:#222;color:#fff;font-size:16px;margin-top:10px}
.total{margin:16px 0 8px;text-align:center;font-size:18px}
.buy{width:100%;padding:15px;border:0;border-radius:12px;background:#2a7de1;color:#fff;font-size:17px}
.hide{display:none}
</style>
</head>
<body>
<h1>Market SR</h1>
<div class="tabs">
  <button id="tS" class="on" onclick="tab('stars')">⭐ Stars</button>
  <button id="tR" onclick="tab('robux')">R$ Robux</button>
</div>

<div id="stars">
  <div class="grid" id="starGrid"></div>
  <input id="custom" type="number" min="50" placeholder="Свое количество (от 50)" oninput="customStars()">
</div>

<div id="robux" class="hide">
  <div class="grid" id="robGrid"></div>
</div>

<div class="total" id="total">Выберите товар</div>
<button class="buy" onclick="buy()">Купить</button>

<script>
// ===== ЦЕНЫ (меняй тут) =====
var STAR_COST = 220;      // закупка за 1 звезду, сум
var STAR_PROFIT = 5000;   // твой заработок с заказа, сум
var STAR_PACKS = [50, 100, 250, 500, 1000, 2500];
var ROBUX = [               // цена уже с заработком
  {r: 40, p: 10000},
  {r: 80, p: 15000}
  // добавь остальные пакеты: {r: 400, p: ЦЕНА},
];
var SELLER = "leytoss";
// ============================

var tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
var cur = null;
function fmt(n){ return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ") + " сум"; }
function starPrice(n){ return n*STAR_COST + STAR_PROFIT; }

function tab(t){
  document.getElementById("stars").className = t=="stars" ? "" : "hide";
  document.getElementById("robux").className = t=="robux" ? "" : "hide";
  document.getElementById("tS").className = t=="stars" ? "on" : "";
  document.getElementById("tR").className = t=="robux" ? "on" : "";
  cur = null; draw(); show();
}
function pick(el, item){
  cur = item; draw(); el.className = "card on"; show();
}
function draw(){
  var cs = document.querySelectorAll(".card"); 
  for (var i=0;i<cs.length;i++) cs[i].className = "card";
}
function show(){
  document.getElementById("total").textContent = cur ? cur.label + " — " + fmt(cur.price) : "Выберите товар";
}
function customStars(){
  var n = parseInt(document.getElementById("custom").value);
  draw();
  if (n >= 50) cur = {label: n + " звезд", price: starPrice(n)}; else cur = null;
  show();
}
function build(id, list){
  var g = document.getElementById(id);
  list.forEach(function(it){
    var d = document.createElement("div");
    d.className = "card";
    d.innerHTML = "<b>" + it.title + "</b><span>" + fmt(it.price) + "</span>";
    d.onclick = function(){ document.getElementById("custom").value=""; pick(d, it); };
    g.appendChild(d);
  });
}
build("starGrid", STAR_PACKS.map(function(n){ return {title:"⭐ "+n, label:n+" звезд", price:starPrice(n)}; }));
build("robGrid", ROBUX.map(function(x){ return {title:x.r+" R$", label:x.r+" Robux", price:x.p}; }));

function buy(){
  if (!cur) { alert("Выберите товар"); return; }
  var msg = "Здравствуйте! Хочу купить: " + cur.label + ". Сумма: " + fmt(cur.price) + ". Кому отправить?";
  var url = "https://t.me/" + SELLER + "?text=" + encodeURIComponent(msg);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
}
</script>
</body>
</html>
